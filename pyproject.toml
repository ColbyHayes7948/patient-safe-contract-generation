[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-safe-contract-generation"
version = "0.1.0"
description = "A typed healthtech service that generates appointment contracts and patient-safe notifications."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["contract_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
